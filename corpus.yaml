# Correcciones sobre las que se aplica el marco.
#
# Cada entrada es un proyecto la ruta de su clon y las correcciones a evaluar recordar que las rutas son relativas a la raiz del proyecto para que el archivo sirva
# igual en cualquier maquina.

# Cada correccion lleva la fuente que la respalda es decir el identificador del aviso publicado esa es la diferencia entre un corpus declarado y una lista de
# commits que alguien escogio.

# linea_base dice cuantos cambios ordinarios tomar por cada correccion esto para contrastar y la seleccion la hace el prototipo con un criterio declarado no
# se hace a mano.

# raiz_servicios dice bajo que carpeta agrupa sus servicios el proyecto esto se deja vacio o se omite cuando estan en la raiz del repositorio como en
# Argo CD y se declara cuando no como en Harbor que los mete bajo src.

# Se intento tambien con Traefik y quedo afuera no porque el criterio lo rechazara sino porque ese proyecto no menciona el identificador del aviso en
# ningun mensaje de commit de toda su historia asi que no hay de donde descubrir nada esa es una limitacion del metodo y esta declarada como tal el
# descubrimiento solo funciona sobre proyectos que citan el aviso al corregir.

